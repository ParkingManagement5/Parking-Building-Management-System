spring:
  datasource:
    # serverTimezone phai khop voi time_zone that cua MySQL server (SYSTEM = gio he
    # dieu hanh, +07:00), neu khong driver se ghi sai lech LocalDateTime xuong DB
    # (xem hibernate.jdbc.time_zone ben duoi).
    url: jdbc:mysql://localhost:3306/parking_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: "12345"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
