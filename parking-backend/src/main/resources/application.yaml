spring:
  application:
    name: parking-backend

  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/parking_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: 12345
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: never

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080

jwt:
  secret: swp391-parking-dev-secret-key-must-be-at-least-256-bits-long-string
  expiration: 86400000

google:
  client-id: ${GOOGLE_CLIENT_ID:1035279450306-nv8sjrtdev50chrsmrsetmin25o516he.apps.googleusercontent.com}

ocr:
  confidence-threshold: 0.85
  upload-dir: uploads/ocr
  engine-url: ${OCR_ENGINE_URL:http://localhost:8000/recognize}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
